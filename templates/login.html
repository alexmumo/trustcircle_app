<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
    <title>TrustCircle | Login</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

:root{
  --primary:#0f766e;
  --secondary:#14b8a6;
  --dark:#0f172a;
  --light:#ffffff;
  --text:#334155;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#14b8a630 0%,transparent 40%),
    radial-gradient(circle at bottom right,#0f766e30 0%,transparent 40%),
    linear-gradient(135deg,#f0fdfa,#ecfeff,#f8fafc);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:30px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.brand{
  display:flex;
  align-items:center;
  gap:15px;
}

.brand-mark{
  width:55px;
  height:55px;
  border-radius:18px;
  background:linear-gradient(
      135deg,
      var(--primary),
      var(--secondary)
  );
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:1.5rem;
  font-weight:700;
  box-shadow:0 12px 25px rgba(15,118,110,.3);
}

.brand span{
  font-size:1.8rem;
  font-weight:700;
  color:var(--dark);
}

.nav a{
  text-decoration:none;
  margin-left:20px;
  color:var(--dark);
  font-weight:600;
  transition:.3s;
}

.nav a:hover{
  color:var(--primary);
}

.box{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:25px;
}

.hero{
  background:linear-gradient(
      135deg,
      #0f766e,
      #14b8a6
  );
  color:white;
  border-radius:30px;
  padding:40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow:0 20px 40px rgba(15,118,110,.25);
}

.hero h1{
  font-size:3rem;
  line-height:1.1;
  margin-bottom:15px;
}

.hero p{
  opacity:.9;
  line-height:1.8;
  margin-bottom:25px;
}

.stats{
  display:flex;
  gap:20px;
}

.stat{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(20px);
  padding:15px;
  border-radius:15px;
}

.stat h3{
  font-size:1.4rem;
}

.card{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(20px);
  border-radius:28px;
  padding:30px;
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}

.card h2{
  color:var(--dark);
  margin-bottom:20px;
}

form{
  display:flex;
  flex-direction:column;
  gap:15px;
}

input{
  padding:14px 18px;
  border-radius:14px;
  border:2px solid #e2e8f0;
  outline:none;
  transition:.3s;
  font-size:15px;
  background:#fff;
}

input:focus{
  border-color:var(--secondary);
  box-shadow:0 0 0 4px rgba(20,184,166,.15);
}

.btn{
  border:none;
  padding:15px;
  border-radius:14px;
  cursor:pointer;
  color:white;
  font-weight:700;
  font-size:15px;
  background:linear-gradient(
      135deg,
      var(--primary),
      var(--secondary)
  );
  transition:.3s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 25px rgba(15,118,110,.25);
}

.status{
  padding-top:10px;
  font-size:.9rem;
}

.status.success{
  color:#16a34a;
}

.status.error{
  color:#dc2626;
}

@media(max-width:992px){

  .box{
    grid-template-columns:1fr;
  }

  .hero{
    text-align:center;
  }

  .stats{
    justify-content:center;
  }

  .topbar{
    flex-direction:column;
    gap:15px;
  }
}
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">T</div>
          <span>TrustCircle</span>
        </div>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/dashboard">Dashboard</a>
        </nav>
      </header>

      <div class="box">

  <div class="hero">
    <h1>Borrow & Invest with Confidence</h1>

    <p>
      TrustCircle connects borrowers and lenders in a secure,
      transparent and community-driven financial ecosystem.
    </p>

    <div class="stats">
      <div class="stat">
        <h3>100%</h3>
        <span>Secure</span>
      </div>

      <div class="stat">
        <h3>24/7</h3>
        <span>Access</span>
      </div>

      <div class="stat">
        <h3>KES</h3>
        <span>M-Pesa Ready</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Welcome Back 👋</h2>

    <form id="loginForm">
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="status" id="loginStatus"></div>
  </div>

  <div class="card">
    <h2>Create Account 🚀</h2>

    <form id="registerForm">
      <input type="text" name="full_name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="password" name="password" placeholder="Create Password" required>

      <button type="submit" class="btn btn-primary">Get Started</button>
    </form>

    <div class="status" id="registerStatus"></div>
  </div>

</div>

    <script>
      async function apiCall(url, options = {}) {
        const response = await fetch(url, {
          headers: { 'Content-Type': 'application/json' },
          ...options
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || data.message || 'Request failed');
        }
        return data;
      }

      function showStatus(id, message, type='success') {
        const el = document.getElementById(id);
        el.textContent = message;
        el.className = 'status ' + type;
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        try {
          await apiCall('/api/login', {
            method: 'POST',
            body: JSON.stringify({
              email: form.email.value,
              password: form.password.value
            })
          });
          showStatus('loginStatus', 'Login successful.', 'success');
          window.location.href = '/dashboard';
        } catch (err) {
          showStatus('loginStatus', err.message, 'error');
        }
      });

      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        try {
          await apiCall('/api/register', {
            method: 'POST',
            body: JSON.stringify({
              full_name: form.full_name.value,
              email: form.email.value,
              password: form.password.value
            })
          });
          showStatus('registerStatus', 'Registration successful.', 'success');
          window.location.href = '/dashboard';
        } catch (err) {
          showStatus('registerStatus', err.message, 'error');
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js').catch((err) => {
            console.log('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
