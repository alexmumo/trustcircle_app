<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
    <title>TrustCircle | Dashboard</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --primary:#0f766e;
  --primary-dark:#115e59;
  --accent:#14b8a6;
  --info:#0ea5e9;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#f59e0b;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Inter',sans-serif;
  color:var(--text);

  background:
    radial-gradient(circle at top left,#ccfbf1,transparent 30%),
    radial-gradient(circle at top right,#dbeafe,transparent 30%),
    #f8fafc;

  min-height:100vh;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:20px 28px;

  border-radius:24px;

  background:rgba(255,255,255,.75);

  backdrop-filter:blur(15px);

  border:1px solid rgba(255,255,255,.3);

  box-shadow:
    0 8px 32px rgba(0,0,0,.08);

  margin-bottom:25px;
}

.brand{
  display:flex;
  align-items:center;
  gap:15px;
  font-size:1.5rem;
  font-weight:800;
}

.brand-mark{
  width:50px;
  height:50px;

  border-radius:16px;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--accent)
    );

  color:white;
  font-size:1.4rem;
}

.nav{
  display:flex;
  align-items:center;
  gap:12px;
}

.nav a{
  text-decoration:none;
  color:var(--text);
  font-weight:600;
}

.btn{
  border:none;
  border-radius:15px;

  padding:12px 18px;

  cursor:pointer;

  font-weight:700;

  transition:.25s ease;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  background:
      linear-gradient(
      135deg,
      var(--primary),
      var(--accent));

  color:white;
}

.btn-secondary{
  background:#dbeafe;
  color:#0369a1;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.card{
  background:white;

  border-radius:24px;

  padding:22px;

  transition:.3s ease;

  box-shadow:
    0 8px 25px rgba(0,0,0,.06);
}

.card:hover{
  transform:translateY(-5px);

  box-shadow:
    0 15px 40px rgba(0,0,0,.1);
}

.stats .card:nth-child(1){
  background:#ecfdf5;
}

.stats .card:nth-child(2){
  background:#eff6ff;
}

.stats .card:nth-child(3){
  background:#fff7ed;
}

.stats .card:nth-child(4){
  background:#f5f3ff;
}

.stat-label{
  color:var(--muted);
  font-size:.8rem;

  text-transform:uppercase;

  font-weight:700;

  letter-spacing:.08em;
}

.stat-value{
  margin-top:10px;

  font-size:2rem;

  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:20px;
}

.section{
  margin-top:30px;
}

.section-title{
  font-size:1.25rem;
  font-weight:800;
  margin-bottom:15px;
}

form{
  display:flex;
  flex-direction:column;
  gap:14px;
}

input,
select,
textarea{
  width:100%;

  border:none;

  background:#f8fafc;

  border-radius:14px;

  padding:14px;

  font-size:.95rem;

  transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;

  background:white;

  box-shadow:
    0 0 0 4px rgba(20,184,166,.15);
}

textarea{
  resize:vertical;
  min-height:100px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.item{
  background:white;

  border-radius:18px;

  padding:18px;

  box-shadow:
      0 4px 16px rgba(0,0,0,.05);

  transition:.25s;
}

.item:hover{
  transform:translateY(-3px);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.muted{
  color:var(--muted);
}

.tag{
  display:inline-block;

  padding:6px 12px;

  border-radius:999px;

  font-size:.75rem;

  font-weight:700;
}

.tag.pending,
.tag.funding{
  background:#fef3c7;
  color:#92400e;
}

.tag.paid,
.tag.disbursed,
.tag.funded{
  background:#dcfce7;
  color:#166534;
}

.tag.overdue,
.tag.defaulted{
  background:#fee2e2;
  color:#991b1b;
}

.status{
  min-height:22px;
  margin-top:10px;
  font-weight:600;
}

.status.success{
  color:var(--success);
}

.status.error{
  color:var(--danger);
}

.progress{
  height:10px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-top:12px;
}

.progress-fill{
  height:100%;
  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #14b8a6,
      #0ea5e9
    );
}

.hero{
  margin-bottom:25px;

  padding:35px;

  border-radius:28px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #0f766e,
      #14b8a6,
      #06b6d4
    );

  box-shadow:
    0 20px 40px rgba(20,184,166,.3);
}

.hero h1{
  font-size:2rem;
  margin-bottom:8px;
}

.hero p{
  opacity:.95;
}

@media(max-width:950px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .hero h1{
    font-size:1.6rem;
  }
}
</style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">T</div>
          <span>TrustCircle</span>
        </div>
        <div class="nav">
          <a href="/">Home</a>
          <button id="logoutBtn" class="btn btn-danger">Logout</button>
        </div>
      </header>

      <div class="stats">
        <div class="card">
          <div class="stat-label">Wallet</div>
          <div id="walletBalance" class="stat-value">KES 0</div>
        </div>
        <div class="card">
          <div class="stat-label">Trust score</div>
          <div id="trustScore" class="stat-value">0</div>
        </div>
        <div class="card">
          <div class="stat-label">My loans</div>
          <div id="myLoanSummary" class="stat-value">KES 0</div>
        </div>
        <div class="card">
          <div class="stat-label">Expected profit</div>
          <div id="expectedProfit" class="stat-value">KES 0</div>
        </div>
      </div>

      <section class="grid">
        <div class="card">
          <div class="section-title">Wallet</div>
          <form id="depositForm">
    <input
        type="number"
        id="depositAmount"
        min="1"
        step="0.01"
        placeholder="Deposit amount"
        required
    />

    <input
        type="tel"
        id="phoneNumber"
        placeholder="2547XXXXXXXX"
        required
    />

    <button class="btn btn-primary" type="submit">
        Deposit via M-Pesa
    </button>
</form>
          <form id="withdrawForm" style="margin-top: 12px;">
            <input type="number" id="withdrawAmount" min="1" step="0.01" placeholder="Withdraw amount" required />
            <button class="btn btn-secondary" type="submit">Withdraw</button>
          </form>
          <div id="walletStatus" class="status"></div>
        </div>

        <div class="card">
          <div class="section-title">Request a loan</div>
          <form id="loanForm">
            <input type="number" name="amount" min="1000" step="100" placeholder="Loan amount" required />
            <select name="term" required>
              <option value="">Select term</option>
              <option value="1">1 month</option>
              <option value="2">2 months</option>
              <option value="3">3 months</option>
              <option value="6">6 months</option>
            </select>
            <select name="type" required>
              <option value="">Select loan type</option>
              <option>Personal</option>
              <option>Business</option>
              <option>School fees</option>
              <option>Emergency</option>
            </select>
            <textarea name="description" placeholder="Description"></textarea>
            <button class="btn btn-primary" type="submit">Submit loan request</button>
          </form>
          <div id="loanStatus" class="status"></div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Marketplace</div>
        <div id="loanList" class="list"></div>
      </section>

      <section class="section">
        <div class="section-title">My loans</div>
        <div id="myLoansList" class="list"></div>
      </section>

      <section class="section">
        <div class="section-title">My funding</div>
        <div id="myFundingList" class="list"></div>
      </section>

      <section class="section">
        <div class="section-title">Repayments</div>
        <div id="repaymentsList" class="list"></div>
      </section>

      <section class="section">
        <div class="section-title">Recent transactions</div>
        <div id="transactionsList" class="list"></div>
      </section>
    </div>

    <script>
      async function apiCall(url, options = {}) {
        const response = await fetch(url, {
          headers: { 'Content-Type': 'application/json' },
          ...options
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || data.message || 'Request failed');
        }
        return data;
      }

      function money(v) {
        return 'KES ' + Number(v || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
      }
      function setStatus(id, message, type='success') {
        const el = document.getElementById(id);
        el.textContent = message || '';
        el.className = `status ${type}`;
      }

      async function refreshDashboard() {
        try {
          const [wallet, dashboard, loans, myLoans, myFunding, repayments, transactions] = await Promise.all([
            apiCall('/api/wallet'),
            apiCall('/api/dashboard'),
            apiCall('/api/loans'),
            apiCall('/api/my-loans'),
            apiCall('/api/my-funding'),
            apiCall('/api/repayments'),
            apiCall('/api/transactions')
          ]);

          document.getElementById('walletBalance').textContent = money(wallet.balance || 0);
          document.getElementById('trustScore').textContent = dashboard.user.trust_score || 0;
          document.getElementById('myLoanSummary').textContent = money(dashboard.summary.total_requested || 0);
          document.getElementById('expectedProfit').textContent = money(dashboard.summary.expected_profit || 0);

          renderLoanList(loans);
          renderMyLoans(myLoans);
          renderMyFunding(myFunding);
          renderRepayments(repayments);
          renderTransactions(transactions);
        } catch (error) {
          window.location.href = '/login';
        }
      }

      function renderLoanList(loans) {
        const container = document.getElementById('loanList');
        if (!loans || !loans.length) {
          container.innerHTML = '<div class="item muted">No loans available.</div>';
          return;
        }

        container.innerHTML = loans.map((loan) => {
          const remaining = Math.max(0, Number(loan.amount) - Number(loan.funded_amount));
          return `
            <div class="item">
              <div class="row">
                <div>
                  <strong>${loan.loan_type}</strong><br>
                  <span class="muted">Borrower: ${loan.borrower_name}</span>
                </div>
                <span class="tag ${loan.status || 'funding'}">${loan.status || 'funding'}</span>
              </div>
              <div class="row" style="margin-top: 8px;">
                <span>Amount: ${money(loan.amount)}</span>
                <span>Funded: ${money(loan.funded_amount)}</span>
              </div>
              <div class="row" style="margin-top: 8px;">
                <span>Remaining: ${money(remaining)}</span>
                <span>Trust: ${loan.trust_score || 0}</span>
              </div>
              <div class="row" style="margin-top: 12px;">
                <input id="fund-${loan.id}" type="number" min="100" step="100" placeholder="Amount" style="max-width: 180px;" />
                <button class="btn btn-primary" onclick="fundLoan(${loan.id})">Fund</button>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderMyLoans(data) {
        const container = document.getElementById('myLoansList');
        if (!data.loans || !data.loans.length) {
          container.innerHTML = '<div class="item muted">You have no loan requests.</div>';
          return;
        }

        container.innerHTML = data.loans.map((loan) => `
          <div class="item">
            <div class="row">
              <strong>${loan.loan_type}</strong>
              <span class="tag ${loan.status || 'funding'}">${loan.status || 'funding'}</span>
            </div>
            <div class="row" style="margin-top: 8px;">
              <span>Requested: ${money(loan.amount)}</span>
              <span>Funded: ${money(loan.funded_amount)}</span>
            </div>
            <div class="row" style="margin-top: 6px;">
              <span>Remaining: ${money(loan.remaining)}</span>
              <span>Funding: ${loan.funding_percent}%</span>
            </div>
          </div>
        `).join('');
      }

      function renderMyFunding(data) {
        const container = document.getElementById('myFundingList');
        if (!data.funding || !data.funding.length) {
          container.innerHTML = '<div class="item muted">You have not funded any loans yet.</div>';
          return;
        }

        container.innerHTML = data.funding.map((item) => `
          <div class="item">
            <div class="row">
              <strong>${item.borrower_name}</strong>
              <span class="tag ${item.status || 'funding'}">${item.status || 'funding'}</span>
            </div>
            <div class="row" style="margin-top: 8px;">
              <span>Contribution: ${money(item.contribution)}</span>
              <span>Expected profit: ${money(item.expected_profit)}</span>
            </div>
            <div class="row" style="margin-top: 6px;">
              <span>Expected back: ${money(item.expected_back)}</span>
              <span>Return: ${Number(item.return_rate * 100).toFixed(0)}%</span>
            </div>
          </div>
        `).join('');
      }

      function renderRepayments(data) {
        const container = document.getElementById('repaymentsList');
        if (!data || !data.length) {
          container.innerHTML = '<div class="item muted">No repayments due.</div>';
          return;
        }

        container.innerHTML = data.map((item) => `
          <div class="item">
            <div class="row">
              <div>
                <strong>Loan #${item.loan_id}</strong><br>
                <span class="muted">Due: ${item.due_date}</span>
              </div>
              <span class="tag ${item.status || 'pending'}">${item.status || 'pending'}</span>
            </div>
            <div class="row" style="margin-top: 8px;">
              <span>Amount: ${money(item.amount)}</span>
              ${item.status === 'paid' ? '' : '<button class="btn btn-primary" onclick="payRepayment(' + item.id + ')">Pay now</button>'}
            </div>
          </div>
        `).join('');
      }

      function renderTransactions(data) {
        const container = document.getElementById('transactionsList');
        if (!data || !data.length) {
          container.innerHTML = '<div class="item muted">No recent transactions.</div>';
          return;
        }

        container.innerHTML = data.map((item) => `
          <div class="item">
            <div class="row">
              <div>
                <strong>${item.transaction_type}</strong><br>
                <span class="muted">${new Date(item.created_at).toLocaleString()}</span>
              </div>
              <strong>${money(item.amount)}</strong>
            </div>
          </div>
        `).join('');
      }

      async function fundLoan(loanId) {
        const input = document.getElementById(`fund-${loanId}`);
        const amount = Number(input.value);
        if (!amount || amount < 100) {
          setStatus('walletStatus', 'Enter a valid amount of at least KES 100.', 'error');
          return;
        }
        try {
          await apiCall(`/api/loans/${loanId}/fund`, {
            method: 'POST',
            body: JSON.stringify({ amount })
          });
          setStatus('walletStatus', 'Funding successful.', 'success');
          await refreshDashboard();
        } catch (err) {
          setStatus('walletStatus', err.message, 'error');
        }
      }

      async function payRepayment(repId) {
        try {
          await apiCall(`/api/repayments/${repId}/pay`, { method: 'POST' });
          setStatus('walletStatus', 'Repayment successful.', 'success');
          await refreshDashboard();
        } catch (err) {
          setStatus('walletStatus', err.message, 'error');
        }
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
          await apiCall('/api/logout', { method: 'POST' });
          window.location.href = '/login';
        } catch (err) {
          window.location.href = '/login';
        }
      });

      document.getElementById('depositForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const amount = Number(
        document.getElementById('depositAmount').value
    );

    const phoneNumber = document
        .getElementById('phoneNumber')
        .value
        .trim();

    try {
        const result = await apiCall('/api/wallet/mpesa', {
            method: 'POST',
            body: JSON.stringify({
                amount: amount,
                phone_number: phoneNumber
            })
        });

        setStatus(
            'walletStatus',
            result.message || 'M-Pesa STK Push sent. Check your phone.',
            'success'
        );

        document.getElementById('depositForm').reset();

    } catch (err) {
        setStatus(
            'walletStatus',
            err.message,
            'error'
        );
    }
});

      document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const amount = Number(document.getElementById('withdrawAmount').value);
        try {
          await apiCall('/api/wallet/withdraw', {
            method: 'POST',
            body: JSON.stringify({ amount })
          });
          setStatus('walletStatus', 'Withdrawal successful.', 'success');
          document.getElementById('withdrawForm').reset();
          await refreshDashboard();
        } catch (err) {
          setStatus('walletStatus', err.message, 'error');
        }
      });

      document.getElementById('loanForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        try {
          await apiCall('/api/loans', {
            method: 'POST',
            body: JSON.stringify({
              amount: Number(form.amount.value),
              term: Number(form.term.value),
              type: form.type.value,
              description: form.description.value
            })
          });
          setStatus('loanStatus', 'Loan request created.', 'success');
          form.reset();
          await refreshDashboard();
        } catch (err) {
          setStatus('loanStatus', err.message, 'error');
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js').catch((err) => {
            console.log('Service worker registration failed:', err);
          });
        });
      }

      refreshDashboard();
    </script>
  </body>
</html>
